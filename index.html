<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daily Space Explorer</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body>
  <main class="container">
    <header>
      <h1>Daily Space Explorer</h1>
      <p>Explore the universe one day at a time.</p>
    </header>

    <section class="controls">
      <label for="date-picker">Pick a day:</label>
      <input type="date" id="date-picker" />
      <button id="today-btn" class="btn btn-primary">Today</button>
      <button id="random-btn" class="btn btn-secondary">Random Day</button>
    </section>

    <div id="loader" class="loader-container">
      <div class="spinner"></div>
      <p>Loading the latest NASA image.</p>
    </div>

    <div id="error-msg" class="error-card hidden">
      <p>Unable to load data right now. Please try again.</p>
    </div>

    <article id="apod-content" class="card hidden">
      <div class="media-container" id="media-wrapper"></div>

      <div class="details">
        <div class="meta-badge">
          <span id="apod-date">Date</span>
          <span id="apod-copyright" class="copyright"></span>
        </div>
        <h2 id="apod-title">Title</h2>
        <p id="apod-explanation">Explanation...</p>

        <div class="action-buttons">
          <a id="hd-link" href="#" target="_blank" class="btn btn-accent">View Full HD</a>
        </div>
      </div>
    </article>
  </main>

  <footer>
    <p>Powered by NASA APOD API</p>
  </footer>

  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
